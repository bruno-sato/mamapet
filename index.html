  /* ═══════════════════════════════════════════════
     BUTTON
  ═══════════════════════════════════════════════ */
  function Btn({ children, variant = "primary", href, onClick, t, lg, xstyle = {} }) {
    const pad   = lg ? "14px 28px" : "11px 22px";
    const fsize = lg ? 16 : 14;
    const base  = {
      display: "inline-flex", alignItems: "center", gap: 7,
      padding: pad, fontSize: fsize, fontWeight: 700,
      borderRadius: 12, border: "none", cursor: "pointer",
      textDecoration: "none", fontFamily: "inherit",
      transition: "all 0.18s ease", letterSpacing: "-0.01em",
      ...xstyle,
    };
    const vs = {
      primary:  { background: t.primary, color: "#fff" },
      outline:  { background: "transparent", color: t.primary, border: `2px solid ${t.primary}` },
      ghost:    { background: t.primarySoft, color: t.primary },
      wa:       { background: "#25D366", color: "#fff" },
      white:    { background: "#fff", color: t.planBg },
      dark:     { background: t.fg, color: "#fff" },
    };
    const s = { ...base, ...vs[variant] };

    const onEnter = (e) => {
      if (variant === "primary") e.currentTarget.style.background = t.primaryHover;
      if (variant === "outline") e.currentTarget.style.background = t.primarySoft;
      if (variant === "dark")    e.currentTarget.style.opacity = "0.85";
      if (variant === "white")   e.currentTarget.style.opacity = "0.9";
    };
    const onLeave = (e) => {
      if (variant === "primary") e.currentTarget.style.background = t.primary;
      if (variant === "outline") e.currentTarget.style.background = "transparent";
      if (variant === "dark")    e.currentTarget.style.opacity = "1";
      if (variant === "white")   e.currentTarget.style.opacity = "1";
    };

    const props = { style: s, onMouseEnter: onEnter, onMouseLeave: onLeave };
    if (href) return <a href={href} target={href.startsWith("http") ? "_blank" : undefined} rel="noopener noreferrer" {...props}>{children}</a>;
    return <button onClick={onClick} {...props}>{children}</button>;
  }

            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: t.primarySoft, color: t.primary, padding: "5px 14px", borderRadius: 999, fontSize: 11, fontWeight: 800, marginBottom: 18, letterSpacing: 0.8, textTransform: "uppercase" }}>Fale Conosco</div>
            <h2 style={{ fontSize: "clamp(28px, 3.5vw, 42px)", fontWeight: 900, color: t.fg, letterSpacing: "-0.03em", marginBottom: 14 }}>Estamos aqui por você</h2>
            <p style={{ fontSize: 17, color: t.fgMuted, maxWidth: 460, margin: "0 auto", lineHeight: 1.65 }}>
              Entre em contato ou agende direto pelo WhatsApp — respondemos rapidinho!
            </p>
          </div>

          <div className="contact-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 48, marginBottom: 72 }}>
            {/* Info + CTA */}
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {infos.map((c, i) => (
                <div key={i} style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 16, padding: "18px 20px", display: "flex", alignItems: "flex-start", gap: 16 }}>
                  <div style={{ width: 44, height: 44, borderRadius: 12, background: t.primarySoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <c.IconComp size={22} color={t.primary} />
                  </div>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 800, color: t.fg, marginBottom: 5, textTransform: "uppercase", letterSpacing: 0.5 }}>{c.title}</div>
                    <div style={{ fontSize: 14, color: t.fgMuted, lineHeight: 1.65, whiteSpace: "pre-line" }}>{c.body}</div>
                  </div>
                </div>
              ))}
              <Btn variant="primary" href={WA} t={t} lg xstyle={{ justifyContent: "center", marginTop: 6 }}>
                <i className="ph ph-whatsapp-logo" style={{ fontSize: 20 }} />
                Chamar no WhatsApp
              </Btn>
            </div>

            {/* Map placeholder */}
            <div style={{ borderRadius: 22, overflow: "hidden", background: `linear-gradient(135deg, ${t.primarySoft}, ${t.accentSoft})`, minHeight: 320, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, border: `1px solid ${t.border}` }}>
              <i className="ph ph-map-trifold" style={{ fontSize: 58, color: t.primary, opacity: 0.4 }} />
              <span style={{ fontSize: 14, fontWeight: 700, color: t.fgMuted }}>Mapa — em breve</span>
            </div>
          </div>
        </div>

        {/* Footer strip */}
        <div style={{ borderTop: `1px solid ${t.border}`, padding: "40px 24px 28px" }}>
          <div style={{ maxWidth: 1160, margin: "0 auto" }}>
            {/* Social row */}
            <div style={{ display: "flex", gap: 16, justifyContent: "center", marginBottom: 36, flexWrap: "wrap" }}>
              {[
                { type: "ig",  label: "@mamapetvet",    sub: "Clínica",      href: "https://www.instagram.com/mamapetvet/" },
                { type: "ig",  label: "@luc_horta",     sub: "Dra. Luciana", href: "https://www.instagram.com/luc_horta/"  },
                { type: "wa",  label: "(19) 3017-1103", sub: "WhatsApp",     href: WA },
              ].map((s, i) => (
                <a key={i} href={s.href} target="_blank" rel="noopener noreferrer" style={{
                  display: "flex", alignItems: "center", gap: 12,
                  background: t.surface, border: `1px solid ${t.border}`,
                  borderRadius: 14, padding: "12px 18px",
                  textDecoration: "none", transition: "all 0.18s ease",
                  minWidth: 200,
                }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = t.primary; e.currentTarget.style.boxShadow = "0 4px 16px rgba(0,0,0,0.07)"; e.currentTarget.style.transform = "translateY(-2px)"; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = t.border; e.currentTarget.style.boxShadow = "none"; e.currentTarget.style.transform = "none"; }}

                      ? <img src="instagram-icon.png" alt="Instagram" style={{ width: 42, height: 42, objectFit: "contain", borderRadius: 10 }} />

                    }
                  </div>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: t.fg, letterSpacing: "-0.01em" }}>{s.label}</div>
                    <div style={{ fontSize: 11, color: t.fgMuted, fontWeight: 500, marginTop: 1 }}>{s.sub}</div>
                  </div>
                </a>
              ))}
            </div>

            {/* Bottom bar */}
            <div className="footer-inner" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, flexWrap: "wrap", paddingTop: 20, borderTop: `1px solid ${t.border}` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <img src="logo.jpeg" alt="" style={{ height: 34, width: 34, borderRadius: "50%", objectFit: "cover" }} />
                <span style={{ fontFamily: "'Caveat', cursive", fontSize: 20, fontWeight: 700, color: t.fg }}>Mama Pet</span>
              </div>
              <p style={{ fontSize: 12, color: t.fgMuted }}>© 2025 Mama Pet Clínica Veterinária · Indaiatuba, SP</p>

        </div>
      </section>
    );
  }

  /* ═══════════════════════════════════════════════
     FLOATING WA
  ═══════════════════════════════════════════════ */
  function FloatingWA() {
    const [show, setShow] = useState(false);
    useEffect(() => {
      const fn = () => setShow(window.scrollY > 220);
      window.addEventListener("scroll", fn);
      return () => window.removeEventListener("scroll", fn);
    }, []);
    return (
      <a href={WA} target="_blank" rel="noopener noreferrer" title="Chamar no WhatsApp" style={{
        position: "fixed", bottom: 28, right: 28, zIndex: 200,
        width: 58, height: 58, borderRadius: "50%", background: "#25D366",
        display: "flex", alignItems: "center", justifyContent: "center",
        boxShadow: "0 4px 22px rgba(37,211,102,0.42)",
        opacity: show ? 1 : 0, transform: show ? "scale(1)" : "scale(0.75)",
        transition: "all 0.3s cubic-bezier(0.34,1.56,0.64,1)",
        pointerEvents: show ? "auto" : "none", textDecoration: "none",
      }}>
        <i className="ph-fill ph-whatsapp-logo" style={{ fontSize: 29, color: "#fff" }} />
      </a>
    );
  }

  /* ═══════════════════════════════════════════════
     APP
  ═══════════════════════════════════════════════ */
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "vitalidade",
    "font": "nunito"
  }/*EDITMODE-END*/;

  function App() {
    const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [active, setActive] = useState("hero");

    const t  = THEMES[tw.theme] || THEMES.ternura;
    const ff = FONTS[tw.font]   || FONTS.nunito;

    useEffect(() => {
      document.body.style.background = t.bg;
      document.body.style.fontFamily = ff;
    }, [t, ff]);

    useEffect(() => {
      const sections = ["hero","servicos","sobre","contato"];
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
      }, { threshold: 0.35 });
      sections.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
      return () => obs.disconnect();
    }, []);

    return (
      <div style={{ fontFamily: ff }}>
        <Nav t={t} ff={ff} active={active} />
        <Hero t={t} ff={ff} />
        <Services t={t} ff={ff} />
        <About t={t} ff={ff} />
        <Contact t={t} ff={ff} />
        <FloatingWA />

        <TweaksPanel>
          <TweakSection label="Tema Visual" />
          <TweakRadio
            label="Variação"
            value={tw.theme}
            options={["ternura", "vitalidade"]}
            onChange={v => setTweak("theme", v)}
          />
          <TweakSection label="Tipografia" />
          <TweakRadio
            label="Fonte"
            value={tw.font}
            options={["nunito", "dmsans"]}
            onChange={v => setTweak("font", v)}
          />
        </TweaksPanel>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
